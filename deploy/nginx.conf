# Alternative to Caddy. /etc/nginx/sites-available/site
server {
    listen 443 ssl http2;
    server_name example.com;
    ssl_certificate     /etc/ssl/cf/origin.pem;   # Cloudflare Origin Certificate
    ssl_certificate_key /etc/ssl/cf/origin.key;
    root /srv/site/current;
    error_page 404 /404.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    gzip on; gzip_types text/css application/javascript image/svg+xml application/xml;

    location /_astro/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
    location /fonts/  { add_header Cache-Control "public, max-age=31536000, immutable"; }
    location /api/    { proxy_pass http://127.0.0.1:8787; proxy_set_header CF-Connecting-IP $http_cf_connecting_ip; client_max_body_size 1m; }
    location /        { try_files $uri $uri/index.html $uri.html =404; }
}
server { listen 443 ssl; server_name www.example.com; ssl_certificate /etc/ssl/cf/origin.pem; ssl_certificate_key /etc/ssl/cf/origin.key; return 308 https://example.com$request_uri; }
